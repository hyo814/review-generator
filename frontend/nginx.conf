# ───── 프론트 + 백엔드 프록시 단일 origin 운영 ─────
# 핵심 아이디어:
# - 사용자는 http://my-server/ 로 접속 (프론트)
# - 프론트가 /api/* 를 호출하면 nginx가 백엔드 컨테이너로 프록시
# - 같은 origin이라 CORS 문제 자체가 발생 안 함
# - 백엔드 포트(8000)는 외부에 노출 안 함, 컨테이너 내부 통신만

# ───── 요청 제한 (IP 기준) ─────
# general: 전체 요청. 비밀번호 무차별 대입도 여기서 같이 막힘 (limit_req가 인증보다 먼저 실행)
# llm: 후기 생성·번역 POST만 카운트 (API 비용 보호). key가 빈 문자열이면 제한 대상 아님
map "$request_method:$uri" $llm_limit_key {
    ~^POST:/api/reviews/(generate|\d+/translate)$  $binary_remote_addr;
    default                                         "";
}
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $llm_limit_key      zone=llm:10m     rate=5r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    # Basic Auth — 계정 파일은 컨테이너 시작 시 htpasswd.sh가 환경변수로 생성
    auth_basic "Review Generator";
    auth_basic_user_file /etc/nginx/.htpasswd;

    limit_req zone=general burst=20 nodelay;
    limit_req_status 429;

    # 정적 파일 (React SPA)
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: 어떤 path든 index.html로 보내서 React Router가 처리
    # (이 앱은 라우터 안 쓰지만, 추후 추가 시를 위해 미리 깔아둠)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 프록시 — backend 서비스명은 docker-compose.yml의 서비스명과 일치
    location /api/ {
        # location에 limit_req를 쓰면 server 레벨 설정은 상속 안 됨 → general도 다시 명시
        limit_req zone=general burst=20 nodelay;
        limit_req zone=llm burst=3 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 호출은 길어질 수 있으니 타임아웃 넉넉하게
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # 정적 자산 캐싱 (해시 파일명이라 immutable 가능)
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
